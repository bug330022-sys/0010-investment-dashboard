
name: Precompute T1 prediction cache

on:
  workflow_dispatch:
  schedule:
    - cron: "10 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: precompute-t1
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Compute daily T1 cache
        run: Rscript precompute_t1.R

      - name: Commit cache only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/t1_precomputed.rds
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh T1 precomputed results"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
